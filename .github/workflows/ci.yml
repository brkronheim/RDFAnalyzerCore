name: CI Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify runner environment
      run: |
        echo "Using self-hosted runner with preinstalled dependencies"
        uname -a

    #- name: Verify CUDA
    #  run: |
    #    export PATH=/usr/local/cuda-12.9/bin:$PATH
    #    export CUDAToolkit_ROOT=/usr/local/cuda-12.9
    #    export LD_LIBRARY_PATH=/usr/local/cuda-12.9/lib64:$LD_LIBRARY_PATH
    #    echo $LD_LIBRARY_PATH
    #    echo $PATH
    #    ls /usr/local/
    #    nvidia-smi


    - name: Verify ROOT
      run: |
        if command -v root-config >/dev/null 2>&1; then
          echo "root-config found:"; root-config --version
        elif command -v root >/dev/null 2>&1; then
          echo "root found:"; root --version
        else
          echo "ERROR: ROOT not found on runner"; exit 1
        fi
        
    - name: Install Python test dependencies
      run: pip3 install -r requirements-ci.txt

    - name: Configure CMake
      run: cmake -S . -B build -DBUILD_TESTS=ON -DRDF_BUILD_EXTENSIONS=OFF -DUSE_CUDA=OFF -DONNXRUNTIME_USE_CUDA=OFF

    - name: Build
      run: |
        # The Python binding translation unit is memory-intensive in Release builds.
        cmake --build build --target rdfanalyzer --parallel 1
        cmake --build build --parallel 2

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

    - name: Check installed Python authoring
      run: |
        cmake --install build --prefix "$RUNNER_TEMP/rdf-python" --component Python
        export PYTHONPATH="$RUNNER_TEMP/rdf-python/python:$(root-config --prefix)/lib:${PYTHONPATH:-}"
        python3 -m rdfanalysis doctor --numba
