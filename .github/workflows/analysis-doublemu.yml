name: CMS DoubleMuon Analysis

# Triggered manually via the GitHub Actions UI or REST API.
# This job builds the CMS Run2016G DoubleMuon analysis, runs the analysis
# executable over a single public CMS Open Data NanoAOD file, and then builds
# the analytic Z→μμ fit inputs (RooFit workspaces + Combine datacards).
# The self-hosted runner needs the CVMFS environment and a CERN GitLab SSH key.
#
# To trigger:
#   GitHub UI:  Actions → "CMS DoubleMuon Analysis (on request)" → Run workflow
#   gh CLI:     gh workflow run analysis-doublemu.yml --ref <branch>
on:
  workflow_dispatch:
    inputs:
      cms_repository:
        description: "CMS extension Git URL (optional override of the pinned repository URL)"
        required: false
      threads:
        description: "Number of RDataFrame threads (default: 1)"
        required: false
        default: "1"

jobs:
  run-analysis:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch CMS and build the DoubleMuon analysis
        env:
          CMS_REPOSITORY: ${{ inputs.cms_repository }}
        run: |
          python3 scripts/fetch_cms.py --repository "$CMS_REPOSITORY"
          source env.sh
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements-ci.txt
          cmake -S . -B build -DRDF_REQUIRED_EXTENSIONS=cms \
            -DRDF_ANALYSES=CMS_Run2016_DoubleMuon -DBUILD_TESTS=OFF \
            -DPython3_EXECUTABLE="$VIRTUAL_ENV/bin/python"
          cmake --build build --target cms_doublemu_analysis --parallel 8

      - name: Run the public NanoAOD example
        env:
          THREADS: ${{ inputs.threads }}
        run: |
          source env.sh
          analysis="$PWD/analyses/CMS_Run2016_DoubleMuon"
          cfg="$analysis/ci_cfg.yaml"
          if [[ -n "$THREADS" && "$THREADS" != "1" ]]; then
            [[ "$THREADS" =~ ^(-1|[0-9]+)$ ]] || { echo "Invalid thread count: $THREADS" >&2; exit 1; }
            cfg=$(mktemp "$analysis/ci_cfg.XXXXXX.yaml")
            trap 'rm -f -- "$cfg"' EXIT
            sed "s/^threads:.*/threads: \"${THREADS}\"/" "$analysis/ci_cfg.yaml" > "$cfg"
          fi
          cd build/analyses/CMS_Run2016_DoubleMuon
          ./cms_doublemu_analysis "$cfg"

      - name: Verify histograms and build Z-peak workspaces
        run: |
          source env.sh
          source .venv/bin/activate
          export PYTHONPATH="$ROOTSYS/lib${PYTHONPATH:+:$PYTHONPATH}"
          meta="build/analyses/CMS_Run2016_DoubleMuon/dimuon_zpeak_ci_meta.root"
          projected="build/analyses/CMS_Run2016_DoubleMuon/dimuon_zpeak_ci_projected.root"
          python core/python/extract_nd_histograms.py "$meta" --output "$projected" --nominal-only
          python - "$projected" <<'PYTHON'
          import sys
          import uproot

          with uproot.open(sys.argv[1]) as output:
              directory = output["Default_Default/Default"]
              inclusive = directory["DimuonMass"].values().sum()
              categories = sum(directory[f"DimuonMass_{jet}"].values().sum()
                               for jet in ("0j", "1j", "2j", "ge3j"))
              if inclusive <= 0 or categories != inclusive:
                  sys.exit(f"Invalid dimuon yields: inclusive={inclusive}, categories={categories}")
              print(f"Verified {inclusive:.0f} selected dimuons")
          PYTHON

          python analyses/CMS_Run2016_DoubleMuon/fit_zpeak.py \
            --input "$projected" --outdir analyticFit_ci_run

      - name: Verify fit outputs
        run: |
          for channel in 0j 1j 2j ge3j; do
            test -s "analyticFit_ci_run/ws_${channel}.root"
            test -s "analyticFit_ci_run/datacard_${channel}.txt"
            test -s "analyticFit_ci_run/fit_${channel}.png"
          done
          test -s analyticFit_ci_run/datacard_combined.txt

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doublemu-analysis-output
          path: |
            build/analyses/CMS_Run2016_DoubleMuon/dimuon_zpeak_ci_meta.root
            analyticFit_ci_run/
          if-no-files-found: error
          retention-days: 7

