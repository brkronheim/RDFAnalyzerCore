name: CMS DoubleMuon Analysis

# Triggered manually via the GitHub Actions UI or REST API.
# This job builds the CMS Run2016G DoubleMuon analysis, runs the analysis
# executable over a single public CMS Open Data NanoAOD file, and then builds
# the analytic Z→μμ fit inputs (RooFit workspaces + Combine datacards).
# The self-hosted runner needs the CVMFS environment and access to the CERN GitLab CMS repository.
#
# To trigger:
#   GitHub UI:  Actions → "CMS DoubleMuon Analysis (on request)" → Run workflow
#   gh CLI:     gh workflow run analysis-doublemu.yml --ref <branch>
on:
  workflow_dispatch:
    inputs:
      cms_repository:
        description: "CMS extension Git URL (optional override of the default repository URL)"
        required: false
      threads:
        description: "Number of RDataFrame threads, auto, or max (default: 1)"
        required: false
        default: "1"

jobs:
  run-analysis:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch CMS and build the DoubleMuon analysis
        env:
          CMS_REPOSITORY: ${{ inputs.cms_repository }}
        run: |
          python3 scripts/fetch_cms.py --repository "$CMS_REPOSITORY"
          source env.sh
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements-ci.txt
          cmake -S . -B build -DRDF_REQUIRED_EXTENSIONS=cms \
            -DRDF_ANALYSES=CMS_Run2016_DoubleMuon -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_COMBINE=OFF -DBUILD_COMBINE_HARVESTER=OFF \
            -DUSE_CUDA=OFF -DONNXRUNTIME_USE_CUDA=OFF \
            -DPython3_EXECUTABLE="$VIRTUAL_ENV/bin/python"
          cmake --build build --target cms_doublemu_analysis --parallel 8

      - name: Run the public NanoAOD example
        env:
          THREADS: ${{ inputs.threads }}
        run: |
          source env.sh
          # Write a minimal override config so the thread count can be injected
          # without modifying the committed ci_cfg.yaml.
          THREADS=${THREADS:-1}
          [[ "$THREADS" =~ ^(auto|max|[-+]?[0-9]+)$ ]] || { echo "Expected an integer, auto, or max"; exit 1; }
          CFG_DIR="$GITHUB_WORKSPACE/analyses/CMS_Run2016_DoubleMuon"
          CFG=$(mktemp "$CFG_DIR/ci_cfg_override.XXXXXX.yaml")
          trap 'rm -f "$CFG"' EXIT
          sed "s/^threads:.*/threads: \"$THREADS\"/" "$CFG_DIR/ci_cfg.yaml" > "$CFG"
          RUN_DIR=$(mktemp -d "$GITHUB_WORKSPACE/doublemu-ci.XXXXXX")
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "HIST_FILE=$RUN_DIR/dimuon_zpeak_ci_meta.root" >> "$GITHUB_ENV"
          echo "FIT_INPUT=$RUN_DIR/dimuon_zpeak_fit.root" >> "$GITHUB_ENV"
          ANALYSIS="$GITHUB_WORKSPACE/build/analyses/CMS_Run2016_DoubleMuon/cms_doublemu_analysis"
          cd "$RUN_DIR"
          "$ANALYSIS" "$CFG"

      - name: Project nominal fit histograms and verify yields
        run: |
          source env.sh
          source .venv/bin/activate
          python core/python/extract_nd_histograms.py "$HIST_FILE" --nominal-only --output "$FIT_INPUT"
          python - "$FIT_INPUT" <<'PYTHON'
          import sys
          import uproot

          with uproot.open(sys.argv[1]) as output:
              directory = output["Default_Default/Default"]
              inclusive = directory["DimuonMass"].values().sum()
              categories = sum(directory[f"DimuonMass_{jet}"].values().sum()
                               for jet in ("0j", "1j", "2j", "ge3j"))
              if inclusive <= 0 or categories != inclusive:
                  sys.exit(f"Invalid dimuon yields: inclusive={inclusive}, categories={categories}")
              print(f"Verified {inclusive:.0f} selected dimuons")
          PYTHON

      - name: Fit every configured channel
        run: |
          source env.sh
          source .venv/bin/activate
          python analyses/CMS_Run2016_DoubleMuon/fit_zpeak.py \
            --input "$FIT_INPUT" --outdir "$RUN_DIR/fit" --strict

      - name: Verify channel workspaces, cards and plots
        run: |
          source env.sh
          source .venv/bin/activate
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import yaml

          config = Path("analyses/CMS_Run2016_DoubleMuon/zpeak_workspace.yaml")
          channels = [row["name"] for row in yaml.safe_load(config.read_text())["channels"]]
          fit = Path(os.environ["RUN_DIR"]) / "fit"
          expected = {"datacard_combined.txt"}
          for channel in channels:
              expected.update((f"ws_{channel}.root", f"datacard_{channel}.txt", f"fit_{channel}.png"))
          actual = {p.name for p in fit.iterdir() if p.is_file() and p.stat().st_size}
          if actual != expected:
              raise SystemExit(f"Missing {expected - actual}, unexpected {actual - expected}")
          PYTHON

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doublemu-analysis-output
          path: |
            ${{ env.HIST_FILE }}
            ${{ env.FIT_INPUT }}
            ${{ env.RUN_DIR }}/fit/
          if-no-files-found: error
          retention-days: 7

