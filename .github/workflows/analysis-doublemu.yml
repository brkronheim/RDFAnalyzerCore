name: CMS DoubleMuon Analysis

# Triggered manually via the GitHub Actions UI or REST API.
# This job builds the CMS Run2016G DoubleMuon analysis, runs the analysis
# executable over a single public CMS Open Data NanoAOD file, and then builds
# the analytic Z→μμ fit inputs (RooFit workspaces + Combine datacards).
#
# To trigger:
#   GitHub UI:  Actions → "CMS DoubleMuon Analysis (on request)" → Run workflow
#   gh CLI:     gh workflow run analysis-doublemu.yml --ref <branch>
on:
  workflow_dispatch:
    inputs:
      cms_repository:
        description: "CMS extension Git URL (optional override of the pinned repository URL)"
        required: false
      threads:
        description: "Number of RDataFrame threads (default: -1 = all CPUs)"
        required: false
        default: "-1"

jobs:
  run-analysis:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify runner environment
        run: |
          echo "Using self-hosted runner with preinstalled dependencies"
          uname -a

      - name: Verify ROOT
        run: |
          if command -v root-config >/dev/null 2>&1; then
            echo "root-config found:"; root-config --version
          elif command -v root >/dev/null 2>&1; then
            echo "root found:"; root --version
          else
            echo "ERROR: ROOT not found on runner"; exit 1
          fi

      - name: Install Python dependencies
        run: pip3 install -r requirements-ci.txt

      - name: Download pinned CMS extension
        env:
          CMS_REPOSITORY: ${{ inputs.cms_repository }}
        run: python3 scripts/fetch_cms.py --repository "$CMS_REPOSITORY"

      - name: Configure CMake
        run: >-
          cmake -S . -B build -DRDF_ENABLE_CMS=ON -DRDF_REQUIRED_EXTENSIONS=cms
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          -DBUILD_TESTS=OFF -DBUILD_COMBINE=ON -DBUILD_COMBINE_HARVESTER=ON
          -DUSE_CUDA=OFF -DONNXRUNTIME_USE_CUDA=OFF

      - name: Build framework and analysis
        run: >-
          cmake --build build --parallel "$(( $(nproc) > 8 ? 8 : $(nproc) ))"

      - name: Run analysis executable
        working-directory: build/analyses/CMS_Run2016_DoubleMuon
        env:
          THREADS: ${{ github.event.inputs.threads }}
        run: |
          # Write a minimal override config so the thread count can be injected
          # without modifying the committed ci_cfg.yaml.
          THREADS=${THREADS:--1}
          [[ "$THREADS" =~ ^(auto|max|[-+]?[0-9]+)$ ]] || { echo "Expected an integer, auto, or max"; exit 1; }
          CFG_DIR="$GITHUB_WORKSPACE/analyses/CMS_Run2016_DoubleMuon"
          CFG=$(mktemp "$CFG_DIR/ci_cfg_override.XXXXXX.yaml")
          trap 'rm -f "$CFG"' EXIT
          sed "s/^threads:.*/threads: \"$THREADS\"/" "$CFG_DIR/ci_cfg.yaml" > "$CFG"
          RUN_DIR=$(mktemp -d "$GITHUB_WORKSPACE/doublemu-ci.XXXXXX")
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "HIST_FILE=$RUN_DIR/dimuon_zpeak_ci_meta.root" >> "$GITHUB_ENV"
          echo "FIT_INPUT=$RUN_DIR/dimuon_zpeak_fit.root" >> "$GITHUB_ENV"
          ANALYSIS="$PWD/cms_doublemu_analysis"
          cd "$RUN_DIR"
          "$ANALYSIS" "$CFG"

      - name: Project nominal fit histograms
        run: |
          for py in /usr/bin/python3 "$(command -v python3)"; do
            if "$py" -c 'import ROOT, numpy, yaml; print(ROOT.gROOT.GetVersion())'; then
              FIT_PYTHON="$py"
              break
            fi
          done
          : "${FIT_PYTHON:?Need a Python interpreter with PyROOT, NumPy and PyYAML}"
          echo "FIT_PYTHON=$FIT_PYTHON" >> "$GITHUB_ENV"
          "$FIT_PYTHON" core/python/extract_nd_histograms.py "$HIST_FILE" --nominal-only --output "$FIT_INPUT"

      - name: Fit every configured channel
        run: |
          "$FIT_PYTHON" analyses/CMS_Run2016_DoubleMuon/fit_zpeak.py \
            --input "$FIT_INPUT" --outdir "$RUN_DIR/fit" --strict

      - name: Verify channel workspaces, cards and plots
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import yaml

          config = Path("analyses/CMS_Run2016_DoubleMuon/zpeak_workspace.yaml")
          channels = [row["name"] for row in yaml.safe_load(config.read_text())["channels"]]
          fit = Path(os.environ["RUN_DIR"]) / "fit"
          expected = {"datacard_combined.txt"}
          for channel in channels:
              expected.update((f"ws_{channel}.root", f"datacard_{channel}.txt", f"fit_{channel}.png"))
          actual = {p.name for p in fit.iterdir() if p.is_file() and p.stat().st_size}
          if actual != expected:
              raise SystemExit(f"Missing {expected - actual}, unexpected {actual - expected}")
          PYTHON

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doublemu-analysis-output
          path: |
            ${{ env.HIST_FILE }}
            ${{ env.FIT_INPUT }}
            ${{ env.RUN_DIR }}/fit/
          if-no-files-found: error
          retention-days: 7

