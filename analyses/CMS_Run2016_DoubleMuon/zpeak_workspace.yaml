# =============================================================================
# zpeak_workspace.yaml — workspace configuration for the Z→μμ peak fit
#
# This file drives the AnalyticWorkspaceFitTask (core/python/law/combine_tasks.py).
# It specifies:
#   - The observable (dimuon mass range)
#   - The signal PDF type and initial parameter values
#   - The background PDF type and initial parameter values
#   - The per-channel histogram → channel name mapping
#
# Swap signal/background models by editing the `pdf` fields — no code changes
# are required.  For the full list of supported PDFs see the docstring for
# AnalyticWorkspaceFitTask in core/python/law/combine_tasks.py.
# =============================================================================

# ---------------------------------------------------------------------------
# Observable
# ---------------------------------------------------------------------------
observable:
  name:  mass
  title: "m_{#mu#mu} [GeV]"
  lo:    70.0
  hi:    110.0

# ---------------------------------------------------------------------------
# Signal PDF: Voigtian (Breit-Wigner ⊗ Gaussian resolution)
#
# Swap with, e.g.:
#   pdf: gaussian
#   pdf: crystalball
#   pdf: double_gaussian
#   pdf: breit_wigner
# ---------------------------------------------------------------------------
signal:
  pdf: voigtian
  parameters:
    mean:
      init:  91.2
      min:   88.0
      max:   94.0
      # shared: true ties this parameter across all channels in the combined fit
      shared: true
    width:
      init:  2.495
      fixed: true          # Z natural width — fixed to PDG value
      shared: true
    sigma:
      init:  2.0
      min:   0.1
      max:   8.0

# ---------------------------------------------------------------------------
# Background PDF: Exponential
#
# Swap with, e.g.:
#   pdf: polynomial
#   order: 2               # (for polynomial/chebychev/bernstein)
#   pdf: chebychev
#   pdf: bernstein
# ---------------------------------------------------------------------------
background:
  pdf: exponential
  parameters:
    decay:
      init: -0.05
      min:  -1.0
      max:  -1.0e-4

# ---------------------------------------------------------------------------
# Channels
#
# Each entry maps a nominal TH1 name in the extracted file to a channel.
# The Combine card prefixes the channel ID with ch_. The optional label
# is used for plot titles.
#
# Add or remove jet-bin channels here; no C++ or Python code changes needed.
# ---------------------------------------------------------------------------
channels:
  - name:      0j
    histogram: DimuonMass_0j
    label:     "0 jets"

  - name:      1j
    histogram: DimuonMass_1j
    label:     "1 jet"

  - name:      2j
    histogram: DimuonMass_2j
    label:     "2 jets"

  - name:      ge3j
    histogram: DimuonMass_ge3j
    label:     "≥3 jets"

# Illustrative in-window yields at r=1 and at unit background scale.
# Replace the signal references with independent predictions for the data
# and luminosity being fitted. Each background rate has its own free scale.
combine_rates:
  0j:   {signal: 12000, background: 1000}
  1j:   {signal:  3600, background:  400}
  2j:   {signal:  1000, background:  150}
  ge3j: {signal:   250, background:   40}
