# =============================================================================
# ci_cfg.yaml — CI configuration for the CMS Run2016G DoubleMuon analysis
#
# The on-request analysis CI runs the same single public input as cfg.yaml.
# The separate output filename keeps local and CI artifacts distinct.
#
# The file used is the first Run2016G DoubleMuon NanoAOD file from record 30522:
#   https://opendata.cern.ch/record/30522
# =============================================================================

# ---- Input (single file — fast CI run) -------------------------------------
fileList: >-
  root://eospublic.cern.ch//eos/opendata/cms/Run2016G/DoubleMuon/NANOAOD/UL2016_MiniAODv2_NanoAODv9-v2/2430000/05DD095C-F6C3-9A4F-9FB3-348A5A6403D5.root

treeList: Events

# ---- Output ----------------------------------------------------------------
saveFile: dimuon_zpeak_ci.root
saveDirectory: ./
saveTree: Events
saveConfig: output.yaml
enableSkim: false

# ---- Sample type -----------------------------------------------------------
type: "0"

# ---- Performance -----------------------------------------------------------
# Single-threaded for reproducibility in CI
threads: "1"
batch: "False"

# ---- File filters ----------------------------------------------------------
antiglobs: output.root, hists.root

# ---- Plugin configuration --------------------------------------------------
triggerConfig: triggers.yaml
histogramConfig: histograms.yaml
floatConfig: floats.yaml
intConfig: ints.yaml
